[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2

lib_deps =
    m5stack/M5GFX@^0.2.32
    tanakamasayuki/EspUsbHost@^2.10.0

monitor_speed = 115200
upload_speed = 1500000
